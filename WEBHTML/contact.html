<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - RosterFlow</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Balsamiq+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
</head>
<body style="position: relative; overflow-x: hidden; display: flex; flex-direction: column; min-height: 100vh;">
    <!-- Premium Background Blobs -->
    <div class="background-effects-scroll">
        <div class="blob blob-1" style="top: -5%; left: -10%;"></div>
        <div class="blob blob-5" style="top: 40%; right: -5%;"></div>
        <div class="blob blob-4" style="top: 80%; left: 10%;"></div>
    </div>

    <header class="header" style="position: relative; z-index: 10;">
        <div class="header-container">
            <a href="index.html" style="display: flex; align-items: center; text-decoration: none; color: inherit;">
                <img src="assets/images/logotipo.png" alt="RosterFlow Logo" class="logo">
                <span style="font-size: 24px; font-weight: 700; margin-left: 8px;">RosterFlow</span>
            </a>
            <div class="header-actions">
                <a href="index.html" class="btn-primary" style="background: rgba(255,255,255,0.1); color: white;">Volver</a>
            </div>
        </div>
    </header>

    <main style="flex: 1; position: relative; z-index: 2; width: 100%; max-width: 600px; margin: 80px auto; padding: 24px;">
        <div class="feature-container" style="display:block; text-align:left; background: #ffffff; border: 1px solid #eaeaea; border-radius: 24px; padding: 40px; box-shadow: 0 12px 40px rgba(0,0,0,0.08);">
            <h1 style="margin-bottom:8px; font-size:32px; text-align: center; color: #1a202c;">Contacto</h1>
            <p style="text-align: center; color: #718096; margin-bottom: 32px;">Envíanos un mensaje y te responderemos lo antes posible.</p>

            <form action="https://formsubmit.co/territoriodesign@gmail.com" method="POST" style="display: flex; flex-direction: column; gap: 24px;">
                
                <div style="display: flex; flex-direction: column; gap: 8px;">
                    <label for="name" style="font-weight: 700; color: #4a5568; font-size: 13px; letter-spacing: 0.5px; text-transform: uppercase;">Nombre</label>
                    <input type="text" id="name" name="name" required style="padding: 14px 16px; border-radius: 12px; border: 1px solid #e2e8f0; background: #f7fafc; color: #2d3748; font-family: inherit; font-size: 16px; outline: none; transition: all 0.3s ease;" onfocus="this.style.borderColor='#3182ce'; this.style.background='#ffffff'; this.style.boxShadow='0 0 0 3px rgba(49, 130, 206, 0.15)'" onblur="this.style.borderColor='#e2e8f0'; this.style.background='#f7fafc'; this.style.boxShadow='none'">
                </div>

                <div style="display: flex; flex-direction: column; gap: 8px;">
                    <label for="email" style="font-weight: 700; color: #4a5568; font-size: 13px; letter-spacing: 0.5px; text-transform: uppercase;">Correo Electrónico</label>
                    <input type="email" id="email" name="email" required style="padding: 14px 16px; border-radius: 12px; border: 1px solid #e2e8f0; background: #f7fafc; color: #2d3748; font-family: inherit; font-size: 16px; outline: none; transition: all 0.3s ease;" onfocus="this.style.borderColor='#3182ce'; this.style.background='#ffffff'; this.style.boxShadow='0 0 0 3px rgba(49, 130, 206, 0.15)'" onblur="this.style.borderColor='#e2e8f0'; this.style.background='#f7fafc'; this.style.boxShadow='none'">
                </div>

                <div style="display: flex; flex-direction: column; gap: 8px;">
                    <label for="message" style="font-weight: 700; color: #4a5568; font-size: 13px; letter-spacing: 0.5px; text-transform: uppercase;">Mensaje</label>
                    <textarea id="message" name="message" rows="5" required style="padding: 14px 16px; border-radius: 12px; border: 1px solid #e2e8f0; background: #f7fafc; color: #2d3748; font-family: inherit; font-size: 16px; outline: none; transition: all 0.3s ease; resize: vertical;" onfocus="this.style.borderColor='#3182ce'; this.style.background='#ffffff'; this.style.boxShadow='0 0 0 3px rgba(49, 130, 206, 0.15)'" onblur="this.style.borderColor='#e2e8f0'; this.style.background='#f7fafc'; this.style.boxShadow='none'"></textarea>
                </div>

                <button type="submit" class="btn-primary" style="margin-top: 16px; border: none; cursor: pointer; width: 100%; justify-content: center;">Enviar Mensaje</button>
            </form>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-container">
            <p data-i18n="footerText">© RosterFlow 2025 todos los derechos reservados</p>
            <div class="footer-links">
                <a href="privacy_policy.html" data-i18n="privacyPolicy">Política de Privacidad</a>
                <a href="terms_and_conditions.html" data-i18n="termsAndConditions">Términos y Condiciones</a>
                <a href="faq.html" data-i18n="faq">Preguntas Frecuentes</a>
                <a href="contact.html" data-i18n="support">Soporte</a>
            </div>
        </div>
    </footer>
</body>
</html>
