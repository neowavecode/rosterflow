name: rosterflowweb
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  flutter_html: ^3.0.0
  flutter_inappwebview: ^6.0.0
  video_player: ^2.10.0
  url_launcher: ^6.3.2
  carousel_slider: ^5.1.1
  google_fonts: ^6.3.2
  provider: ^6.1.5+1
  visibility_detector: ^0.4.0+2
  youtube_player_iframe: ^5.2.2
  http: ^1.5.0
  supabase_flutter: ^2.10.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  generate: true

  uses-material-design: true

  assets:
    # Update the path below to an existing directory, or create 'assets/html/' if it exists.
    - assets/html/
    - assets/images/
    - assets/images/slider/
    - assets/videos/